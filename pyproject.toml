[project]
name = "likeness"
version = "0.1.0"
description = "Likeness: a personal portrait studio. A phone-shaped web app, and the workstation server that renders for it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private, personal use" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "segno>=1.6",
]

[project.scripts]
likeness = "likeness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2>=1.0"]
# The workstation's side: installed with  uv sync --group gpu  on the machine that owns the GPU.
gpu = [
  "torch>=2.15",
  "torchvision>=0.29.2",
  "diffusers>=0.43",
  "transformers>=5.23",
  "accelerate>=1.16",
  "peft>=0.21",
  "bitsandbytes>=0.50",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "huggingface_hub>=2.4",
  "numpy>=2",
  "onnxruntime-gpu>=1.32",
]
# CPU-only face tools, for checking the face gate and likeness score without a GPU.
faces = ["numpy>=2", "onnxruntime>=1.20"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "gpu" }, { group = "faces" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["likeness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
